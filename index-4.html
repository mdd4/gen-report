<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ── Local storage helpers ─────────────────────────────────
const ls = {
  get: (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del: (k) => { try { localStorage.removeItem(k); } catch(e){} },
};

// ── Scroll Wheel ──────────────────────────────────────────
const HOURS   = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
const MINUTES = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0"));

function ScrollWheel({ items, value, onChange, width }) {
  const ref  = useRef(null);
  const ih   = 44;
  const tout = useRef(null);
  const usr  = useRef(false);
  const idx  = items.indexOf(value);

  useEffect(() => {
    if (ref.current && !usr.current) {
      const i = items.indexOf(value);
      if (i >= 0) ref.current.scrollTop = i * ih;
    }
  }, [value, items]);

  const onScroll = () => {
    usr.current = true;
    clearTimeout(tout.current);
    tout.current = setTimeout(() => {
      if (ref.current) {
        const i = Math.max(0, Math.min(Math.round(ref.current.scrollTop / ih), items.length - 1));
        ref.current.scrollTo({ top: i * ih, behavior: "smooth" });
        onChange(items[i]);
      }
      usr.current = false;
    }, 80);
  };

  return (
    <div className="relative" style={{ width: width || 70, height: ih * 3 }}>
      <div className="absolute inset-x-0 top-1/2 transform -translate-y-1/2 h-11 bg-blue-600 bg-opacity-20 border-t border-b border-blue-500 border-opacity-40 rounded pointer-events-none" style={{zIndex:10}} />
      <div ref={ref} onScroll={onScroll} className="h-full overflow-y-scroll no-scrollbar"
        style={{ scrollSnapType: "y mandatory", paddingTop: ih, paddingBottom: ih, WebkitOverflowScrolling: "touch" }}>
        {items.map((item, i) => (
          <div key={item} style={{ height: ih, scrollSnapAlign: "center" }}
            className={`flex items-center justify-center ${i === idx ? "text-white text-xl font-bold" : "text-gray-500 text-lg"}`}
            onClick={() => { onChange(item); if (ref.current) ref.current.scrollTo({ top: i * ih, behavior: "smooth" }); }}>
            {item}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Time Picker ───────────────────────────────────────────
function TimePicker({ value, onChange, label }) {
  const [open, setOpen] = useState(false);
  const [hr,   setHr]   = useState("07");
  const [min,  setMin]  = useState("00");

  const openPicker = () => {
    if (value) { setHr(value.split(":")[0]); setMin(value.split(":")[1]); }
    setOpen(true);
  };

  return (
    <div>
      <button onClick={openPicker}
        className={`w-full py-3 px-3 rounded-lg text-center text-lg font-mono ${value ? "bg-gray-800 border border-blue-500 border-opacity-50 text-white" : "bg-gray-800 border border-gray-700 text-gray-500"}`}>
        {value || "-- : --"}
      </button>
      {open && (
        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-end justify-center" style={{zIndex:50}}
          onClick={(e) => { if (e.target === e.currentTarget) setOpen(false); }}>
          <div className="bg-gray-900 w-full rounded-t-2xl p-6 pb-8" style={{maxWidth:"32rem"}}>
            <div className="text-center text-sm text-gray-400 mb-2">{label}</div>
            <div className="text-center text-4xl font-mono font-bold text-white mb-6">{hr}:{min}</div>
            <div className="flex justify-center items-center gap-4 mb-8">
              <ScrollWheel items={HOURS}   value={hr}  onChange={setHr}  width={90} />
              <span className="text-3xl font-bold text-gray-400">:</span>
              <ScrollWheel items={MINUTES} value={min} onChange={setMin} width={90} />
            </div>
            <div className="flex gap-3">
              <button onClick={() => { onChange(""); setOpen(false); }} className="flex-1 py-3 rounded-lg bg-gray-800 text-gray-400 font-medium">Clear</button>
              <button onClick={() => setOpen(false)}                    className="flex-1 py-3 rounded-lg bg-gray-800 text-gray-300 font-medium">Cancel</button>
              <button onClick={() => { onChange(`${hr}:${min}`); setOpen(false); }} className="flex-1 py-3 rounded-lg bg-blue-600 text-white font-medium">Set</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Helpers ───────────────────────────────────────────────
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate  = (iso) => { if (!iso) return ""; const [y,m,d] = iso.split("-"); return `${m}/${d}/${y.slice(2)}`; };
const newId    = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function buildReport(jobNum, g) {
  const L = [];
  if (jobNum)                               { L.push(`Job # ${jobNum}`); L.push(""); }
  if (g.xfmrNum)                            { L.push(`Location ${g.xfmrNum}`); if (g.gps) L.push(`GPS ${g.gps}`); L.push(""); }
  if (g.manufacturer && g.genNum && g.kw)   { L.push(`${g.manufacturer}: ${g.genNum}`); L.push(`${g.kw}kW`); L.push(""); }
  if (g.perp)                               { L.push(`CARB #: ${g.perp}`); L.push(""); }

  const hasHours = g.startHours || g.endHours;
  if (g.startHours)  L.push(`Start hours: ${g.startHours}`);
  if (g.endHours)    L.push(`End hours: ${g.endHours}`);
  if (hasHours)      L.push("");

  const hasFuel = g.startFuel || g.endFuel;
  if (g.startFuel)   L.push(`Start fuel: ${g.startFuel}%`);
  if (g.endFuel)     L.push(`End fuel: ${g.endFuel}%`);
  if (hasFuel)       L.push("");

  const hasDEF = g.startDEF || g.endDEF;
  if (g.startDEF)    L.push(`Start DEF: ${g.startDEF}%`);
  if (g.endDEF)      L.push(`End DEF: ${g.endDEF}%`);
  if (hasDEF)        L.push("");

  if (g.onlineTime && g.onlineDate)           { L.push(`Online time: ${g.onlineTime}`); L.push(`Date: ${fmtDate(g.onlineDate)}`); L.push(""); }
  if (g.offlineTime && g.offlineDate)         { L.push(`Offline time: ${g.offlineTime}`); L.push(`Date: ${fmtDate(g.offlineDate)}`); }

  while (L.length && L[L.length - 1] === "") L.pop();
  return L.join("\n");
}

// ── Shared Components ─────────────────────────────────────
function Field({ label, children }) {
  return (
    <div>
      <label className="block text-xs font-medium text-gray-400 mb-1 text-center">{label}</label>
      {children}
    </div>
  );
}

const ic = "w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-3 text-base text-gray-100 focus:outline-none focus:border-blue-500";

function CopyButton({ text }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1400); };
    const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done(); };
    navigator.clipboard ? navigator.clipboard.writeText(text).then(done).catch(fallback) : fallback();
  };
  return (
    <button onClick={copy} className={`w-full py-3 rounded-lg text-base font-semibold ${copied ? "bg-green-600 text-white" : "bg-blue-600 text-white"}`}>
      {copied ? "✓ Copied!" : "Copy Report"}
    </button>
  );
}

function Confirm({ message, onConfirm, onCancel, confirmLabel }) {
  return (
    <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center px-6" style={{zIndex:60}}>
      <div className="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full" style={{maxWidth:"24rem"}}>
        <p className="text-gray-200 text-base mb-5 text-center">{message}</p>
        <div className="flex gap-3">
          <button onClick={onCancel}  className="flex-1 py-3 rounded-lg bg-gray-800 text-gray-300 font-medium">Cancel</button>
          <button onClick={onConfirm} className="flex-1 py-3 rounded-lg bg-red-600 text-white font-medium">{confirmLabel || "Delete"}</button>
        </div>
      </div>
    </div>
  );
}

// ── Data defaults ─────────────────────────────────────────
const EMPTY_XFMR = { xfmrNum: "", gps: "", lat: "", lon: "" };
const EMPTY_GEN  = {
  manufacturer: "", genNum: "", kw: "", perp: "",
  startHours: "", endHours: "", startFuel: "", endFuel: "", startDEF: "", endDEF: "",
  onlineTime: "", onlineDate: "", offlineTime: "", offlineDate: "",
};

const newGenEntry = () => ({ id: newId(), xfmr: { ...EMPTY_XFMR }, gen: { ...EMPTY_GEN, onlineDate: todayISO(), offlineDate: todayISO() } });
const newLocalJob = () => ({ id: newId(), jobNum: "", gens: [newGenEntry()], activeGenIdx: 0, created: Date.now() });

function genLabel(g, allGens) {
  if (!allGens) return "Location";
  const idx = allGens.indexOf(g);
  return idx >= 0 ? `Location ${idx + 1}` : "Location";
}

// ── Storage keys ──────────────────────────────────────────
const JOB_INDEX_KEY = "gr-job-index";
const jobKey        = (id) => `gr-job-${id}`;
const UI_KEY        = "gr-ui";

const loadJobIndex  = ()    => ls.get(JOB_INDEX_KEY) || [];
const saveJobIndex  = (idx) => ls.set(JOB_INDEX_KEY, idx);
const loadLocalJob  = (id)  => ls.get(jobKey(id));
const saveLocalJob  = (job) => ls.set(jobKey(job.id), job);
const deleteJobData = (id)  => ls.del(jobKey(id));

// ── App ───────────────────────────────────────────────────
function App() {
  const [loaded,       setLoaded]       = useState(false);
  const [screen,       setScreen]       = useState("jobs");
  const [jobIndex,     setJobIndex]     = useState([]);
  const [activeJob,    setActiveJob]    = useState(null);
  const [tab,          setTab]          = useState(0);
  const [pickerOpen,   setPickerOpen]   = useState(false);
  const [confirm,      setConfirm]      = useState(null);
  const [scanState,    setScanState]    = useState(null);
  const [scanTarget,   setScanTarget]   = useState(null);
  const [scanPreview,  setScanPreview]  = useState(null);
  const [scanResult,   setScanResult]   = useState(null);
  const [scanError,    setScanError]    = useState("");
  const [createOpen,   setCreateOpen]   = useState(false);
  const [createMode,   setCreateMode]   = useState("blank"); // "blank" | "import"
  const [createError,  setCreateError]  = useState("");
  const [importText,   setImportText]   = useState("");
  const [importParsing,setImportParsing]= useState(false);
  const [importPreview,setImportPreview]= useState(null);
  const [lastJobId,    setLastJobId]    = useState(null);
  const [lastTab,      setLastTab]      = useState(0);
  const cameraInputRef = useRef(null);

  // ── Load on mount ──
  useEffect(() => {
    // one-time cleanup of keys from the removed cloud/admin features
    ls.del("gr-tokens"); ls.del("gr-admin");
    setJobIndex(loadJobIndex());
    const ui = ls.get(UI_KEY);
    if (ui?.lastJobId) {
      const job = loadLocalJob(ui.lastJobId);
      if (job) { setActiveJob(job); setLastJobId(ui.lastJobId); setLastTab(ui.lastTab || 0); }
    }
    setLoaded(true);
  }, []);

  // ── Persist UI state ──
  useEffect(() => {
    if (!loaded) return;
    ls.set(UI_KEY, { lastJobId: activeJob?.id || null, lastTab: tab });
    if (activeJob?.id) setLastJobId(activeJob.id);
    setLastTab(tab);
  }, [activeJob, tab, loaded]);

  // ── Persist local job ──
  useEffect(() => {
    if (!loaded || !activeJob) return;
    saveLocalJob(activeJob);
    setJobIndex(idx => {
      const updated = idx.find(j => j.id === activeJob.id)
        ? idx.map(j => j.id === activeJob.id ? { ...j, jobNum: activeJob.jobNum } : j)
        : idx;
      saveJobIndex(updated);
      return updated;
    });
  }, [activeJob, loaded]);

  // ── Import parser ──
  // Two accepted formats:
  //   1. GENREPORT-IMPORT block  — exact data, emitted by the Gen Job project
  //   2. Raw PG&E job dispatch   — regex extraction, best effort
  // Neither path calls the API.
  const runImportParse = () => {
    if (!importText.trim()) return;
    setImportParsing(true);
    setCreateError("");
    setImportPreview(null);

    try {
      const text = importText;

      // ══ Format 1: GENREPORT-IMPORT block ══
      // GENREPORT-IMPORT
      // job=262071
      // location=1|37.334722,-121.888611|100
      // END-IMPORT
      const blockMatch = text.match(/GENREPORT-IMPORT([\s\S]*?)END-IMPORT/i);
      if (blockMatch) {
        const body = blockMatch[1];

        const jobMatch = body.match(/job\s*=\s*(\d{4,10})/i);
        if (!jobMatch) throw new Error("Import block found, but no job= line in it.");
        const jobNum = jobMatch[1];

        const gens = [];
        const lineRe = /location\s*=\s*(\d+)\s*\|\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\|\s*(\d+)/gi;
        let m;
        while ((m = lineRe.exec(body)) !== null) {
          gens.push({ xfmrNum: m[1], lat: m[2], lon: m[3], kw: m[4], vendor: "" });
        }
        if (gens.length === 0) throw new Error("Import block found, but no valid location= lines. Expected: location=1|lat,lon|kW");

        gens.sort((a, b) => Number(a.xfmrNum) - Number(b.xfmrNum));
        setImportPreview({ jobNum, gens, source: "block" });
        setImportParsing(false);
        return;
      }

      // ══ Format 2: raw dispatch ══

      // Job number: first standalone 6-digit number
      const jobNumMatch = text.match(/\b(\d{6})\b/);
      const jobNum = jobNumMatch ? jobNumMatch[1] : "";
      if (!jobNum) throw new Error("No job number found");

      // Detect vendor from material list
      const KNOWN_VENDORS = ["United Rentals", "Aggreko", "Caterpillar", "CAT", "Generac", "Cummins", "Atlas Copco", "Multiquip", "Kohler"];
      let detectedVendor = "";
      for (const v of KNOWN_VENDORS) {
        if (text.includes(v)) { detectedVendor = v; break; }
      }

      // Parse generators
      // Format A: "XFMR - N" blocks (new format)
      // Format B: "Location N –" blocks (old format)
      const gens = [];

      // Try Format A: XFMR blocks
      const xfmrBlocks = text.split(/XFMR\s*-\s*\d+/i).slice(1);
      if (xfmrBlocks.length > 0) {
        for (let i = 0; i < xfmrBlocks.length; i++) {
          const block = xfmrBlocks[i];
          const locationNum = String(i + 1);

          // kW: from "1\n100KW Generator" or "1 100KW Generator"
          const kwMatch = block.match(/\b(\d+)\s*KW\s+Generator/i);
          const kw = kwMatch ? kwMatch[1] : "";

          // GPS: lat, lon on its own line
          const gpsMatch = block.match(/(-?\d{2,3}\.\d+),\s*(-?\d{2,3}\.\d+)/);
          const lat = gpsMatch ? gpsMatch[1] : "";
          const lon = gpsMatch ? gpsMatch[2] : "";

          gens.push({ xfmrNum: locationNum, kw, lat, lon, vendor: detectedVendor });
        }
      }

      // Try Format B: Location blocks (fallback)
      if (gens.length === 0) {
        const locBlocks = text.split(/Location\s+\d+\s*[–-]/i).slice(1);
        for (let i = 0; i < locBlocks.length; i++) {
          const block = locBlocks[i];
          const locationNum = String(i + 1);

          const kwMatch = block.match(/\b(\d+)\s*KW\s+Generator/i);
          const kw = kwMatch ? kwMatch[1] : "";

          // GPS from maps URL
          const mapsMatch = block.match(/maps\?q=(-?\d+\.\d+),(-?\d+\.\d+)/);
          const coordMatch = block.match(/(-?\d{2,3}\.\d+),\s*(-?\d{2,3}\.\d+)/);
          const lat = (mapsMatch || coordMatch)?.[1] || "";
          const lon = (mapsMatch || coordMatch)?.[2] || "";

          gens.push({ xfmrNum: locationNum, kw, lat, lon, vendor: detectedVendor });
        }
      }

      if (gens.length === 0) throw new Error("No generators found");

      setImportPreview({ jobNum, gens, source: "dispatch" });
    } catch(e) {
      const msg = String(e?.message || "");
      // Block-specific problems get the real message — the generic advice
      // would be misleading when a block was clearly present.
      setCreateError(/^Import block/.test(msg)
        ? msg
        : "Could not parse. Paste either the full job dispatch (with XFMR sections) or the whole GENREPORT-IMPORT block including its END-IMPORT line.");
    }
    setImportParsing(false);
  };

  const createImportedJob = () => {
    if (!importPreview) return;
    setCreateError("");

    const gens = importPreview.gens.map(g => {
      const entry = newGenEntry();
      entry.xfmr.xfmrNum     = g.xfmrNum || "";
      entry.gen.kw           = g.kw || "";
      entry.gen.manufacturer = g.vendor || "";
      if (g.lat && g.lon) {
        entry.xfmr.lat = g.lat;
        entry.xfmr.lon = g.lon;
        entry.xfmr.gps = `${g.lat}, ${g.lon}`;
      }
      return entry;
    });

    try {
      const job = { id: newId(), jobNum: importPreview.jobNum, gens, activeGenIdx: 0, created: Date.now() };
      saveLocalJob(job);
      const idx = [{ id: job.id, jobNum: job.jobNum, created: job.created }, ...jobIndex];
      setJobIndex(idx);
      saveJobIndex(idx);
      setActiveJob(job);
      setLastJobId(job.id);
      setLastTab(0);
      setScreen("entry");
      setTab(0);
      closeCreateModal();
    } catch(e) {
      setCreateError("Could not save the job. Try again.");
    }
  };

  // ── Vision scan ──
  // Per-field prompts — each returns a single-key JSON object
  const FIELD_PROMPTS = {
    manufacturer: `Look at this photo and find the name of the rental company or generator manufacturer (e.g. "United Rentals", "Aggreko", "CAT", "Generac", "Cummins", "Multiquip"). Return ONLY valid JSON: {"manufacturer":"value"} — empty string if not visible. Do not guess.`,
    genNum:       `Look at this photo and find the generator unit number, serial number, or asset number (often labeled "Unit #", "Serial #", "Asset #", "Gen ID", or similar — a short alphanumeric code). Return ONLY valid JSON: {"genNum":"value"} — empty string if not visible. Do not guess.`,
    kw:           `Look at this photo and find the kilowatt (kW) rating of the generator (e.g. 40, 65, 100, 125, 150). Return the number only. Return ONLY valid JSON: {"kw":"value"} — empty string if not visible. Do not guess.`,
    perp:         `Look at this photo and find the PERP or CARB registration number. This is found on a blue plate that says "California Air Resources Board" or "Portable Equipment Registration Program". The number is printed on the plate, e.g. "179933". It may also be labeled "PERP #", "CARB#", or "CGC#" elsewhere. Return ONLY valid JSON: {"perp":"value"} — empty string if not visible. Do not guess.`,
    startHours:   `Look at this photo and find the engine hour meter reading (labeled "Start Hrs", "Hours", "Hrs", or shown on a digital display). Return the number only, decimal ok (e.g. "4521.3"). Return ONLY valid JSON: {"startHours":"value"} — empty string if not visible. Do not guess.`,
    startFuel:    `Look at this photo and find the fuel level percentage (labeled "Fuel", "Start Fuel", or shown on a gauge — number only, e.g. "85"). Return ONLY valid JSON: {"startFuel":"value"} — empty string if not visible. Do not guess.`,
    startDEF:     `Look at this photo and find the DEF (Diesel Exhaust Fluid) level percentage (labeled "DEF", "AdBlue", or similar — number only, e.g. "100"). Return ONLY valid JSON: {"startDEF":"value"} — empty string if not visible. Do not guess.`,
    endHours:     `Look at this photo and find the engine hour meter reading at shutdown (labeled "End Hrs", "Hours", or shown on a digital display). Return the number only, decimal ok. Return ONLY valid JSON: {"endHours":"value"} — empty string if not visible. Do not guess.`,
    endFuel:      `Look at this photo and find the fuel level percentage at shutdown (labeled "Fuel", "End Fuel" — number only). Return ONLY valid JSON: {"endFuel":"value"} — empty string if not visible. Do not guess.`,
    endDEF:       `Look at this photo and find the DEF level percentage at shutdown (labeled "DEF", "AdBlue" — number only). Return ONLY valid JSON: {"endDEF":"value"} — empty string if not visible. Do not guess.`,
  };

  // Sheet scan prompt — fills everything from a handwritten job sheet
  const SHEET_PROMPT = `You are reading a handwritten generator deployment field sheet. These sheets have labels like:
JOB NAME, ADDRESS, GEN ID, SIZE, JOB#, LOC#, CARB#/CGC#, DATE, START HRS, END HRS, TIME ON, TIME OFF, FUEL (start/end), DEF (start/end).
Extract whatever fields are filled in. Return ONLY valid JSON with these keys (omit any that are blank or unreadable):
{
  "jobNum": "JOB# value, 6 digits only",
  "locationNum": "LOC# value, number only",
  "genNum": "GEN ID value",
  "kw": "SIZE/kW value, number only (e.g. 40)",
  "perp": "CARB# or CGC# value — the registration number from the blue California Air Resources Board plate, or next to the label CARB# on the sheet, e.g. 179933",
  "startHours": "START HRS value, decimal ok",
  "endHours": "END HRS value, decimal ok",
  "onlineTime": "TIME ON in 24hr HH:MM format — convert if needed (e.g. 6:40 → 06:40)",
  "offlineTime": "TIME OFF in 24hr HH:MM format",
  "startFuel": "FUEL start value, number only (strip % sign)",
  "endFuel": "FUEL end value, number only",
  "startDEF": "DEF start value, number only (NA means blank)",
  "endDEF": "DEF end value, number only"
}
Do not guess. If a field says NA or is blank, omit it entirely.`;

  const triggerScan = (target) => {
    setScanTarget(target);
    setScanState(null);
    setScanPreview(null);
    setScanResult(null);
    setScanError("");
    if (cameraInputRef.current) {
      cameraInputRef.current.value = "";
      cameraInputRef.current.click();
    }
  };

  const handleImageCapture = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setScanState("scanning");

    // Compress image before sending — higher res for sheet scans (more small text)
    const compressImage = (file) => new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const MAX = scanTarget === "sheet" ? 1600 : 1024;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = url;
    });

    const dataUrl = await compressImage(file);
    setScanPreview(dataUrl);
    const base64 = dataUrl.split(",")[1];
    const isSheet = scanTarget === "sheet";
    const prompt = isSheet ? SHEET_PROMPT : FIELD_PROMPTS[scanTarget];
    try {
      const resp = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: base64,
          mediaType: "image/jpeg",
          prompt,
          maxTokens: isSheet ? 600 : 100,
        })
      });

      // Read as text first — an error page or empty body would break resp.json()
      const raw = await resp.text();
      let data = null;
      try { data = JSON.parse(raw); } catch(e) {}

      if (!resp.ok) {
        const msg = data?.error?.message || data?.error || raw.slice(0, 300) || "no response body";
        throw new Error(`Server error ${resp.status}: ${typeof msg === "string" ? msg : JSON.stringify(msg)}`);
      }
      if (!data) throw new Error(`Unreadable response from /api/scan: ${raw.slice(0, 200)}`);
      if (data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error.message || JSON.stringify(data.error)));

      const text = data.content?.find(c => c.type === "text")?.text || "";
      if (!text) throw new Error(`No text in API response: ${JSON.stringify(data).slice(0, 250)}`);

      const clean = text.replace(/```json|```/g, "").trim();
      let parsed;
      try { parsed = JSON.parse(clean); }
      catch(e) { throw new Error(`Model did not return JSON. It said: ${clean.slice(0, 200)}`); }

      if (isSheet) {
        setScanResult(parsed);
        setScanState("done");
      } else {
        const val = parsed[scanTarget];
        if (val) {
          if (scanTarget === "locationNum") updateXfmr({ xfmrNum: val });
          else updateGen({ [scanTarget]: val });
          setScanState(null);
          setScanPreview(null);
        } else {
          // Request worked, model just couldn't find the value
          setScanError("");
          setScanState("empty");
        }
      }
    } catch(err) {
      setScanError(err.message || String(err));
      setScanState("error");
    }
  };

  const applySheetResult = () => {
    if (!scanResult) return;
    const xpatch = {};
    const gpatch = {};
    if (scanResult.jobNum)      updateJob({ jobNum: scanResult.jobNum });
    if (scanResult.locationNum) xpatch.xfmrNum = scanResult.locationNum;
    if (scanResult.genNum)      gpatch.genNum   = scanResult.genNum;
    if (scanResult.kw)          gpatch.kw       = scanResult.kw;
    if (scanResult.perp)        gpatch.perp     = scanResult.perp;
    if (scanResult.startHours)  gpatch.startHours  = scanResult.startHours;
    if (scanResult.endHours)    gpatch.endHours    = scanResult.endHours;
    if (scanResult.onlineTime)  gpatch.onlineTime  = scanResult.onlineTime;
    if (scanResult.offlineTime) gpatch.offlineTime = scanResult.offlineTime;
    if (scanResult.startFuel)   gpatch.startFuel   = scanResult.startFuel;
    if (scanResult.endFuel)     gpatch.endFuel     = scanResult.endFuel;
    if (scanResult.startDEF)    gpatch.startDEF    = scanResult.startDEF;
    if (scanResult.endDEF)      gpatch.endDEF      = scanResult.endDEF;
    if (Object.keys(xpatch).length) patchActiveGen({ xfmr: { ...activeGen.xfmr, ...xpatch } });
    if (Object.keys(gpatch).length) updateGen(gpatch);
    setScanState(null);
    setScanPreview(null);
    setScanResult(null);
  };

  // Camera icon SVG
  const camIcon = (
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  );

  // Small inline scan button for individual fields
  const CamBtn = ({ target }) => (
    <button onClick={() => triggerScan(target)}
      className="flex items-center justify-center text-blue-400 px-2 py-2 bg-gray-800 border border-gray-700 rounded-lg flex-shrink-0"
      title="Scan photo">
      {camIcon}
    </button>
  );

  // ── Local job actions ──
  const openJob = (id) => { const job = loadLocalJob(id); if (job) { setActiveJob(job); setLastJobId(id); setLastTab(0); setScreen("entry"); setTab(0); } };
  const createJob = () => {
    const job = newLocalJob(); saveLocalJob(job);
    const idx = [{ id: job.id, jobNum: "", created: job.created }, ...jobIndex];
    setJobIndex(idx); saveJobIndex(idx); setActiveJob(job); setLastJobId(job.id); setLastTab(0); setScreen("entry"); setTab(0);
  };
  const deleteLocalJob = (id) => {
    deleteJobData(id);
    const idx = jobIndex.filter(j => j.id !== id); setJobIndex(idx); saveJobIndex(idx);
    if (lastJobId === id) setLastJobId(null);
    if (activeJob?.id === id) { setActiveJob(null); setScreen("jobs"); }
    setConfirm(null);
  };

  // ── Create-job modal helpers ──
  const resetCreateModal = () => {
    setImportText(""); setImportPreview(null); setImportParsing(false); setCreateError("");
  };
  const openCreateModal = () => { setCreateMode("blank"); resetCreateModal(); setCreateOpen(true); };
  const closeCreateModal = () => { setCreateOpen(false); resetCreateModal(); };

  // ── Gen actions ──
  const safeIdx   = activeJob ? Math.min(activeJob.activeGenIdx, activeJob.gens.length - 1) : 0;
  const activeGen = activeJob?.gens[safeIdx] || null;

  const updateJob  = (patch) => setActiveJob(j => ({ ...j, ...patch }));
  const updateGens = (fn)    => setActiveJob(j => ({ ...j, gens: fn(j.gens) }));
  const patchActiveGen = (patch) => {
    setActiveJob(j => {
      const gens = j.gens.map((g, i) => i === safeIdx ? { ...g, ...patch } : g);
      return { ...j, gens };
    });
  };
  const updateXfmr = (patch) => patchActiveGen({ xfmr: { ...activeGen.xfmr, ...patch } });
  const updateGen  = (patch) => patchActiveGen({ gen:  { ...activeGen.gen,  ...patch } });

  const addGen = () => {
    updateGens(gs => [...gs, newGenEntry()]);
    updateJob({ activeGenIdx: activeJob.gens.length });
    setPickerOpen(false);
  };

  const deleteGen = (idx) => {
    updateGens(gs => gs.filter((_, i) => i !== idx));
    updateJob({ activeGenIdx: Math.max(0, Math.min(safeIdx, activeJob.gens.length - 2)) });
    setConfirm(null);
  };

  const clearGen = () => patchActiveGen({ gen: { ...EMPTY_GEN, onlineDate: todayISO(), offlineDate: todayISO() } });

  const flatGen = activeGen ? {
    xfmrNum: activeGen.xfmr.xfmrNum, gps: activeGen.xfmr.gps,
    manufacturer: activeGen.gen.manufacturer, genNum: activeGen.gen.genNum,
    kw: activeGen.gen.kw, perp: activeGen.gen.perp,
    startHours: activeGen.gen.startHours, endHours: activeGen.gen.endHours,
    startFuel:  activeGen.gen.startFuel,  endFuel:  activeGen.gen.endFuel,
    startDEF:   activeGen.gen.startDEF,   endDEF:   activeGen.gen.endDEF,
    onlineTime:  activeGen.gen.onlineTime,  onlineDate:  activeGen.gen.onlineDate,
    offlineTime: activeGen.gen.offlineTime, offlineDate: activeGen.gen.offlineDate,
  } : {};

  const report  = activeJob && activeGen ? buildReport(activeJob.jobNum, flatGen) : "";

  if (!loaded) return <div className="min-h-screen flex items-center justify-center text-gray-400" style={{background:"#030712"}}>Loading...</div>;

  // ════════════════════════════════════════════════════════
  // JOBS SCREEN
  // ════════════════════════════════════════════════════════
  if (screen === "jobs") return (
    <div className="min-h-screen text-gray-100 pb-24" style={{background:"#030712"}}>
      <div style={{maxWidth:"32rem", margin:"0 auto", padding:"1rem"}}>

        {/* Header */}
        <div className="flex items-center justify-between mb-5">
          <h1 className="text-xl font-bold text-white">Gen Report</h1>
          <button onClick={openCreateModal}
            className="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium">
            + New Job
          </button>
        </div>

        {/* Create Job modal */}
        {createOpen && (
          <div className="fixed inset-0 bg-black bg-opacity-90 flex flex-col items-end justify-start" style={{zIndex:60}}>
            <div className="bg-gray-950 border-l border-gray-800 w-full h-full overflow-y-auto no-scrollbar" style={{maxWidth:"32rem"}}>
              <div className="p-5 pb-12">

                {/* Modal header */}
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <div className="text-base font-bold text-white">+ New Job</div>
                    <div className="text-xs text-gray-500 mt-0.5">Saved on this device</div>
                  </div>
                  <button onClick={closeCreateModal} className="text-gray-400 text-xl px-2">✕</button>
                </div>

                {/* Mode toggle — only shown before preview */}
                {!importPreview && (
                  <div className="flex gap-1 mb-4 bg-gray-900 border border-gray-800 rounded-lg p-1">
                    <button onClick={() => { setCreateMode("blank"); setCreateError(""); }}
                      className={`flex-1 py-2 text-xs font-medium rounded ${createMode === "blank" ? "bg-blue-600 text-white" : "text-gray-400"}`}>
                      Blank Job
                    </button>
                    <button onClick={() => { setCreateMode("import"); setCreateError(""); }}
                      className={`flex-1 py-2 text-xs font-medium rounded ${createMode === "import" ? "bg-blue-600 text-white" : "text-gray-400"}`}>
                      ⬇ Import
                    </button>
                  </div>
                )}

                {/* BLANK PATH */}
                {!importPreview && createMode === "blank" && (
                  <div className="space-y-3">
                    <p className="text-sm text-gray-400">
                      Create a blank job and fill in details on the next screen.
                    </p>
                    <button onClick={() => { createJob(); closeCreateModal(); }}
                      className="w-full py-3 rounded-lg bg-blue-600 text-white text-base font-semibold">
                      ✓ Create Job
                    </button>
                  </div>
                )}

                {/* IMPORT PATH — paste */}
                {!importPreview && createMode === "import" && (
                  <div className="space-y-3">
                    <p className="text-xs text-gray-500 leading-relaxed">
                      Paste a <span className="text-gray-300 font-mono">GENREPORT-IMPORT</span> block from the Gen Job project, or the raw PG&amp;E dispatch.
                    </p>
                    <textarea
                      className="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-3 text-sm text-gray-200 focus:outline-none focus:border-blue-500 font-mono leading-relaxed"
                      style={{minHeight:"260px", resize:"none"}}
                      value={importText}
                      onChange={e => { setImportText(e.target.value); setCreateError(""); }}
                      placeholder={"GENREPORT-IMPORT\njob=262071\nlocation=1|37.334722,-121.888611|100\nEND-IMPORT\n\n— or paste the full dispatch —"}
                    />
                    {createError && <div className="text-red-400 text-xs px-1">{createError}</div>}
                    <button onClick={runImportParse} disabled={importParsing || !importText.trim()}
                      className={`w-full py-3 rounded-lg text-base font-semibold flex items-center justify-center gap-2 ${importParsing || !importText.trim() ? "bg-gray-800 text-gray-500" : "bg-blue-600 text-white"}`}>
                      {importParsing
                        ? <><svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Parsing...</>
                        : "✦ Parse"}
                    </button>
                  </div>
                )}

                {/* IMPORT PATH — preview */}
                {importPreview && (
                  <div className="space-y-3">
                    <div className="bg-gray-900 border border-gray-800 rounded-lg p-4">
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-medium text-gray-400 uppercase tracking-widest">Job</span>
                        <span className="font-mono font-bold text-xl text-white">{importPreview.jobNum}</span>
                      </div>
                      <div className="mb-2">
                        {importPreview.source === "block" ? (
                          <span className="text-xs px-2 py-0.5 rounded-full bg-green-600 bg-opacity-20 border border-green-600 border-opacity-40 text-green-400 font-medium">Import block — exact values</span>
                        ) : (
                          <span className="text-xs px-2 py-0.5 rounded-full bg-yellow-600 bg-opacity-20 border border-yellow-600 border-opacity-40 text-yellow-400 font-medium">Raw dispatch — parsed, check kW &amp; GPS</span>
                        )}
                      </div>
                      <div className="text-xs font-medium text-gray-500 mb-2">{importPreview.gens.length} Generator{importPreview.gens.length !== 1 ? "s" : ""} found
                        {importPreview.gens[0]?.vendor && <span className="ml-2 text-blue-400">· {importPreview.gens[0].vendor}</span>}
                      </div>
                      <div className="space-y-1.5">
                        {importPreview.gens.map((g, i) => (
                          <div key={i} className="flex items-center justify-between bg-gray-800 rounded-lg px-3 py-2">
                            <div>
                              <span className="font-mono text-sm text-white font-medium">Location {g.xfmrNum || (i + 1)}</span>
                              {g.lat && <span className="text-xs text-blue-400 ml-2">📍 GPS</span>}
                            </div>
                            <span className="text-xs text-gray-400 font-mono">{g.kw ? `${g.kw}kW` : "—"}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    {createError && <div className="text-red-400 text-xs px-1">{createError}</div>}
                    <div className="flex gap-2">
                      <button onClick={() => { setImportPreview(null); setCreateError(""); }}
                        className="flex-1 py-3 rounded-lg bg-gray-800 text-gray-300 font-medium text-sm">← Re-paste</button>
                      <button onClick={createImportedJob}
                        className="flex-1 py-3 rounded-lg bg-green-600 text-white font-semibold text-sm">✓ Create Job</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        {/* Jobs */}
        {jobIndex.length > 0 && <div className="text-xs font-medium text-gray-500 mb-2 uppercase tracking-widest">Jobs</div>}
        {jobIndex.length === 0 && <div className="text-center py-10 text-gray-600 text-sm">No jobs yet — tap + New Job to start</div>}
        <div className="space-y-2">
          {jobIndex.map(j => {
            const isLast = j.id === lastJobId;
            return (
              <div key={j.id} className={`flex items-center rounded-lg overflow-hidden border ${isLast ? "bg-blue-950 border-blue-700" : "bg-gray-900 border-gray-800"}`}>
                <button className="flex-1 text-left px-4 py-4" onClick={() => { if (isLast) { setScreen("entry"); setTab(lastTab); } else { openJob(j.id); } }}>
                  <div className="flex items-center gap-2">
                    <span className="font-mono font-bold text-lg text-white">{j.jobNum || <span className="text-gray-600">No job number</span>}</span>
                    {isLast && <span className="text-xs px-2 py-0.5 rounded-full bg-blue-600 text-white font-medium">Continue →</span>}
                  </div>
                  <div className="text-xs text-gray-500 mt-0.5">{new Date(j.created).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</div>
                </button>
                <button onClick={() => setConfirm({ type: "localJob", id: j.id, jobNum: j.jobNum })} className="px-4 py-4 text-red-400 text-sm border-l border-gray-800">✕</button>
              </div>
            );
          })}
        </div>
      </div>

      {confirm?.type === "localJob" && <Confirm message={`Delete job ${confirm.jobNum || "this job"}?`} onConfirm={() => deleteLocalJob(confirm.id)} onCancel={() => setConfirm(null)} />}
    </div>
  );

  // ════════════════════════════════════════════════════════
  // ENTRY SCREEN
  // ════════════════════════════════════════════════════════
  return (
    <div className="min-h-screen text-gray-100 pb-24" style={{background:"#030712"}}>
      {/* Hidden camera input */}
      <input ref={cameraInputRef} type="file" accept="image/*"
        onChange={handleImageCapture} style={{display:"none"}} />

      {/* Scan overlay — only shown for sheet scan or errors */}
      {scanState && (
        <div className="fixed inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center px-6" style={{zIndex:70}}>
          <div className="bg-gray-900 border border-gray-700 rounded-2xl p-5 w-full" style={{maxWidth:"24rem"}}>
            {scanState === "scanning" && (
              <div className="flex flex-col items-center gap-4 py-4">
                {scanPreview && <img src={scanPreview} alt="scan" className="w-full rounded-lg object-cover" style={{maxHeight:"180px"}} />}
                <div className="flex items-center gap-2 text-blue-400">
                  <svg className="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                  <span className="text-sm font-medium">Reading image...</span>
                </div>
              </div>
            )}
            {scanState === "empty" && (
              <div className="flex flex-col items-center gap-4 py-2">
                {scanPreview && <img src={scanPreview} alt="scan" className="w-full rounded-lg object-cover" style={{maxHeight:"140px"}} />}
                <div className="text-gray-300 text-sm text-center">No value found for this field in the photo. Try a closer or straighter shot.</div>
                <button onClick={() => { setScanState(null); setScanPreview(null); }} className="w-full py-3 rounded-lg bg-gray-800 text-gray-300 font-medium">Close</button>
              </div>
            )}
            {scanState === "error" && (
              <div className="flex flex-col items-stretch gap-3 py-2">
                <div className="text-red-400 text-sm text-center font-medium">Scan failed</div>
                <pre className="bg-gray-800 border border-gray-700 rounded-lg p-3 text-xs text-gray-300 whitespace-pre-wrap font-mono overflow-y-auto select-all" style={{maxHeight:"200px"}}>{scanError || "Unknown error"}</pre>
                <button onClick={() => { setScanState(null); setScanPreview(null); setScanError(""); }} className="w-full py-3 rounded-lg bg-gray-800 text-gray-300 font-medium">Close</button>
              </div>
            )}
            {scanState === "done" && scanResult && (
              <div className="space-y-3">
                <div className="text-sm font-medium text-white text-center mb-1">Review Sheet Scan</div>
                {scanPreview && <img src={scanPreview} alt="scan" className="w-full rounded-lg object-cover" style={{maxHeight:"130px"}} />}
                <div className="bg-gray-800 rounded-lg p-3 space-y-1 overflow-y-auto" style={{maxHeight:"220px"}}>
                  {Object.entries(scanResult).filter(([,v]) => v).map(([k,v]) => (
                    <div key={k} className="flex justify-between items-center text-sm">
                      <span className="text-gray-400 text-xs">{k.replace(/([A-Z])/g," $1").trim()}</span>
                      <span className="text-white font-mono font-medium text-xs">{v}</span>
                    </div>
                  ))}
                  {Object.keys(scanResult).length === 0 && <div className="text-gray-500 text-xs text-center">No values detected — try a clearer photo</div>}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => { setScanState(null); setScanPreview(null); setScanResult(null); }} className="flex-1 py-3 rounded-lg bg-gray-800 text-gray-300 font-medium text-sm">Discard</button>
                  <button onClick={applySheetResult} className="flex-1 py-3 rounded-lg bg-blue-600 text-white font-medium text-sm">Apply All</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      <div style={{maxWidth:"32rem", margin:"0 auto", padding:"1rem"}}>

        {/* Header */}
        <div className="flex items-center gap-3 mb-4">
          <button onClick={() => setScreen("jobs")} className="text-gray-400 text-sm px-2 py-1 bg-gray-800 rounded-lg flex-shrink-0">← Jobs</button>
          <div className="flex-1">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xs font-semibold tracking-widest uppercase text-gray-500">Job Number</span>
            </div>
            <input
              className="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-xl font-mono font-bold text-white focus:outline-none focus:border-blue-500 placeholder-gray-700"
              value={activeJob.jobNum} onChange={e => updateJob({ jobNum: e.target.value })}
              placeholder="261158" inputMode="numeric" maxLength={10} />
          </div>
        </div>

        {/* Tabs */}
        <div className="flex gap-1 mb-5">
          {["Entry", "Report"].map((t, i) => (
            <button key={i} onClick={() => setTab(i)}
              className={`flex-1 py-2 text-xs font-medium rounded-lg ${tab === i ? "bg-blue-600 text-white" : "bg-gray-800 text-gray-400"}`}>
              {t}
            </button>
          ))}
        </div>

        {/* ── Entry Tab ── */}
        {tab === 0 && activeGen && (
          <div className="space-y-4">

            {/* Sheet scan */}
            <button onClick={() => triggerScan("sheet")}
              className="w-full py-3 rounded-lg bg-gray-900 border border-blue-800 text-blue-400 text-sm font-medium flex items-center justify-center gap-2">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              Scan Job Sheet — fill all fields from one photo
            </button>

            {/* Location block */}
            <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-medium text-blue-400">Location</span>
                <div className="flex items-center gap-2">
                  <button onClick={() => setPickerOpen(true)} className="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5">
                    <span className="font-mono font-bold text-sm text-white">{genLabel(activeGen, activeJob.gens)}</span>
                    <span className="text-gray-400 text-2xl leading-none">▾</span>
                  </button>
                  <button onClick={addGen} className="text-xs text-blue-400 font-medium px-2 py-1.5 bg-gray-800 border border-gray-700 rounded-lg">+ New Location</button>
                </div>
              </div>
              <div className="border-t border-gray-800 pt-3 grid grid-cols-3 gap-3">
                <Field label="Location #">
                  <div className="flex gap-1 items-center">
                    <input className={ic + (activeGen.xfmr.xfmrNum ? " opacity-70" : "")}
                      value={activeGen.xfmr.xfmrNum}
                      onChange={e => updateXfmr({ xfmrNum: e.target.value })}
                      readOnly={!!activeGen.xfmr.xfmrNum} inputMode="numeric" />
                    {activeGen.xfmr.xfmrNum && (
                      <button onClick={() => setConfirm({ type: "editGenNum" })}
                        className="text-gray-400 text-xs px-2 py-3 bg-gray-800 border border-gray-700 rounded-lg flex-shrink-0">Edit</button>
                    )}
                  </div>
                </Field>
                <Field label="Latitude">
                  <input className={ic} value={activeGen.xfmr.lat || ""}
                    onChange={e => {
                      const val = e.target.value;
                      if (val.includes(",")) {
                        const [lat, lon] = val.split(",").map(s => s.trim());
                        updateXfmr({ lat: lat || "", lon: lon || "", gps: lat && lon ? `${lat}, ${lon}` : "" });
                      } else {
                        updateXfmr({ lat: val, gps: val && activeGen.xfmr.lon ? `${val}, ${activeGen.xfmr.lon}` : "" });
                      }
                    }}
                    inputMode="decimal" />
                </Field>
                <Field label="Longitude">
                  <input className={ic} value={activeGen.xfmr.lon || ""}
                    onChange={e => updateXfmr({ lon: e.target.value, gps: activeGen.xfmr.lat && e.target.value ? `${activeGen.xfmr.lat}, ${e.target.value}` : "" })}
                    inputMode="decimal" />
                </Field>
              </div>
            </div>

            {/* Generator info */}
            <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-3">
              <span className="text-xs font-medium text-gray-500">Generator Info</span>
              <Field label="Manufacturer / Rental Company">
                <div className="flex gap-1">
                  <input className={ic + " flex-1"} value={activeGen.gen.manufacturer} onChange={e => updateGen({ manufacturer: e.target.value })} />
                  <CamBtn target="manufacturer" />
                </div>
              </Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Generator Number">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.genNum} onChange={e => updateGen({ genNum: e.target.value })} />
                    <CamBtn target="genNum" />
                  </div>
                </Field>
                <Field label="kW Rating">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.kw} onChange={e => updateGen({ kw: e.target.value })} inputMode="numeric" />
                    <CamBtn target="kw" />
                  </div>
                </Field>
              </div>
              <Field label="CARB #">
                <div className="flex gap-1">
                  <input className={ic + " flex-1"} value={activeGen.gen.perp} onChange={e => updateGen({ perp: e.target.value })} />
                  <CamBtn target="perp" />
                </div>
              </Field>
            </div>

            {/* Start data */}
            <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-3">
              <div className="text-xs font-medium text-green-400">Start Data</div>
              <div className="grid grid-cols-3 gap-2">
                <Field label="Start Hours">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.startHours} onChange={e => updateGen({ startHours: e.target.value })} inputMode="decimal" />
                    <CamBtn target="startHours" />
                  </div>
                </Field>
                <Field label="Fuel %">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.startFuel} onChange={e => updateGen({ startFuel: e.target.value })} inputMode="numeric" />
                    <CamBtn target="startFuel" />
                  </div>
                </Field>
                <Field label="DEF %">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.startDEF} onChange={e => updateGen({ startDEF: e.target.value })} inputMode="numeric" />
                    <CamBtn target="startDEF" />
                  </div>
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Online Time (24hr)">
                  <div className="flex gap-1">
                    <div className="flex-1"><TimePicker value={activeGen.gen.onlineTime} onChange={v => updateGen({ onlineTime: v })} label="Online Time" /></div>
                    <button onClick={() => { const n = new Date(); updateGen({ onlineTime: String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0") }); }}
                      className="px-2 py-3 rounded-lg bg-gray-800 border border-gray-700 text-xs text-blue-400 font-medium flex-shrink-0">Now</button>
                  </div>
                </Field>
                <Field label="Online Date">
                  <div className="flex gap-1">
                    <input type="date" className={ic + " flex-1"} value={activeGen.gen.onlineDate} onChange={e => updateGen({ onlineDate: e.target.value })} />
                    <button onClick={() => updateGen({ onlineDate: todayISO() })}
                      className="px-2 py-3 rounded-lg bg-gray-800 border border-gray-700 text-xs text-blue-400 font-medium flex-shrink-0">Today</button>
                  </div>
                </Field>
              </div>
            </div>

            {/* End data */}
            <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-3">
              <div className="text-xs font-medium text-red-400">End Data</div>
              <div className="grid grid-cols-3 gap-2">
                <Field label="End Hours">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.endHours} onChange={e => updateGen({ endHours: e.target.value })} inputMode="decimal" />
                    <CamBtn target="endHours" />
                  </div>
                </Field>
                <Field label="Fuel %">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.endFuel} onChange={e => updateGen({ endFuel: e.target.value })} inputMode="numeric" />
                    <CamBtn target="endFuel" />
                  </div>
                </Field>
                <Field label="DEF %">
                  <div className="flex gap-1">
                    <input className={ic + " flex-1"} value={activeGen.gen.endDEF} onChange={e => updateGen({ endDEF: e.target.value })} inputMode="numeric" />
                    <CamBtn target="endDEF" />
                  </div>
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Offline Time (24hr)">
                  <div className="flex gap-1">
                    <div className="flex-1"><TimePicker value={activeGen.gen.offlineTime} onChange={v => updateGen({ offlineTime: v })} label="Offline Time" /></div>
                    <button onClick={() => { const n = new Date(); updateGen({ offlineTime: String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0") }); }}
                      className="px-2 py-3 rounded-lg bg-gray-800 border border-gray-700 text-xs text-blue-400 font-medium flex-shrink-0">Now</button>
                  </div>
                </Field>
                <Field label="Offline Date">
                  <div className="flex gap-1">
                    <input type="date" className={ic + " flex-1"} value={activeGen.gen.offlineDate} onChange={e => updateGen({ offlineDate: e.target.value })} />
                    <button onClick={() => updateGen({ offlineDate: todayISO() })}
                      className="px-2 py-3 rounded-lg bg-gray-800 border border-gray-700 text-xs text-blue-400 font-medium flex-shrink-0">Today</button>
                  </div>
                </Field>
              </div>
            </div>

            {/* All locations list */}
            {activeJob.gens.length > 1 && (
              <div className="bg-gray-900 border border-gray-800 rounded-lg p-3 space-y-1">
                <div className="text-xs font-medium text-gray-500 mb-2">
                  All Locations — <span className="font-mono text-gray-400">{activeJob.jobNum || "—"}</span>
                </div>
                {activeJob.gens.map((g, i) => (
                  <div key={g.id} className={`flex items-center justify-between px-3 py-2 rounded-lg ${i === safeIdx ? "bg-blue-600 bg-opacity-20 border border-blue-500 border-opacity-30" : "bg-gray-800"}`}>
                    <button className="flex-1 text-left" onClick={() => updateJob({ activeGenIdx: i })}>
                      <span className={`font-mono font-bold text-sm ${i === safeIdx ? "text-blue-300" : "text-gray-200"}`}>{genLabel(g, activeJob.gens)}</span>
                    </button>
                    <button onClick={() => setConfirm({ type: "gen", idx: i })} className="text-red-400 text-xs px-2 py-1 ml-1">✕</button>
                  </div>
                ))}
              </div>
            )}

            <button onClick={() => setTab(1)} className="w-full py-3 rounded-lg bg-blue-600 text-white text-base font-medium">View Report →</button>
            <button onClick={clearGen} className="w-full py-2 rounded-lg bg-gray-900 border border-gray-700 text-gray-500 text-sm">Clear This Location's Data</button>
          </div>
        )}

        {/* ── Report Tab ── */}
        {tab === 1 && activeGen && (
          <div className="space-y-4">
            <div className="bg-gray-900 border border-gray-800 rounded-lg p-4">
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-medium text-gray-400">{genLabel(activeGen, activeJob.gens)}</span>
                <span className="text-xs font-mono text-gray-600">{activeJob.jobNum || "—"}</span>
              </div>
              <pre className="text-sm text-gray-200 whitespace-pre-wrap font-mono leading-relaxed select-all">{report || "No data yet.\n\nFill in the Entry tab first."}</pre>
            </div>
            {report && <CopyButton text={report} />}
            {activeJob.gens.length > 1 && (
              <div className="bg-gray-900 border border-gray-800 rounded-lg p-3">
                <div className="text-xs font-medium text-gray-400 mb-2">Switch Location</div>
                <div className="flex flex-wrap gap-2">
                  {activeJob.gens.map((g, i) => (
                    <button key={g.id} onClick={() => updateJob({ activeGenIdx: i })}
                      className={`px-3 py-2 rounded-lg text-sm font-mono font-medium ${i === safeIdx ? "bg-blue-600 text-white" : "bg-gray-800 text-gray-300"}`}>
                      {genLabel(g, activeJob.gens)}
                    </button>
                  ))}
                </div>
              </div>
            )}
            <button onClick={() => setTab(0)} className="w-full py-3 rounded-lg bg-gray-800 text-gray-300 text-base font-medium">← Edit Entry</button>
          </div>
        )}
      </div>

      {/* Gen picker sheet */}
      {pickerOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-end justify-center" style={{zIndex:50}}
          onClick={(e) => { if (e.target === e.currentTarget) setPickerOpen(false); }}>
          <div className="bg-gray-900 w-full rounded-t-2xl p-4 pb-8" style={{maxWidth:"32rem", maxHeight:"80vh"}}>
            <div className="text-center text-sm text-gray-400 mb-1">Select Location</div>
            <div className="text-center text-xs text-gray-600 mb-3 font-mono">Job {activeJob.jobNum || "—"}</div>
            <div className="overflow-y-auto space-y-1 no-scrollbar" style={{maxHeight:"52vh"}}>
              {activeJob.gens.map((g, i) => (
                <button key={g.id} onClick={() => { updateJob({ activeGenIdx: i }); setPickerOpen(false); }}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-lg ${i === safeIdx ? "bg-blue-600 bg-opacity-30 text-blue-300 border border-blue-500 border-opacity-50" : "bg-gray-800 text-gray-300"}`}>
                  <span className="font-mono font-bold text-base">{genLabel(g, activeJob.gens)}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-3 mt-3">
              <button onClick={addGen} className="flex-1 py-3 rounded-lg bg-blue-600 bg-opacity-20 border border-blue-500 border-opacity-30 text-blue-300 font-medium">+ Add Location</button>
              <button onClick={() => setPickerOpen(false)} className="flex-1 py-3 rounded-lg bg-gray-800 text-gray-300 font-medium">Close</button>
            </div>
          </div>
        </div>
      )}

      {confirm?.type === "editGenNum" && <Confirm message="Clear the Location # so you can edit it?" confirmLabel="Clear" onConfirm={() => { updateXfmr({ xfmrNum: "" }); setConfirm(null); }} onCancel={() => setConfirm(null)} />}
      {confirm?.type === "gen"         && <Confirm message={`Delete ${genLabel(activeJob.gens[confirm.idx], activeJob.gens)}?`} onConfirm={() => deleteGen(confirm.idx)} onCancel={() => setConfirm(null)} />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
